[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "podatlas-pipeline"
version = "0.1.0"
description = "Offline podcast transcription, destination extraction, and static JSON export pipeline for PodAtlas."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "feedparser>=6.0,<7.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "faster-whisper>=1.0.3",
    "openai>=1.35.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
podatlas-pipeline = "podatlas_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
